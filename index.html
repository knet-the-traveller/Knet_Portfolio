<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Responsive viewport meta tag (RWD requirement #1) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Resume of Mark Kenneth Galario — BSIT Student, Hackathon Finalist, Operations &amp; Tech Community Leader">
  <title>Mark Kenneth Galario | Resume</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Skip-to-content link for keyboard / screen-reader users -->
  <a href="#main" class="skip-link">Skip to main content</a>

  <!-- Scroll progress bar (fixed at top of viewport) -->
  <div class="scroll-progress" id="scrollProgress" role="progressbar"
       aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-label="Page scroll progress"></div>

  <!-- ======== HEADER / NAVBAR ======== -->
  <header class="header" id="header">
    <nav class="nav container" aria-label="Main navigation">
      <!-- Logo / brand -->
      <a href="#hero" class="nav__logo" aria-label="Go to top">MKG</a>

      <!-- Hamburger toggle (visible on mobile) -->
      <button class="nav__toggle" id="navToggle"
              aria-label="Open navigation menu" aria-expanded="false" aria-controls="navMenu">
        <span class="hamburger" aria-hidden="true"></span>
      </button>

      <!-- Navigation links — rendered by JS -->
      <ul class="nav__menu" id="navMenu" role="list"></ul>

      <!-- Backdrop overlay for mobile menu (click to close) -->
      <div class="nav__backdrop" id="navBackdrop" aria-hidden="true"></div>

      <!-- Dark / Light theme toggle -->
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon icon--sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon icon--moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
             viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- ======== MAIN CONTENT ======== -->
  <main id="main">
    <!-- Each section is a landmark; JS populates inner content from resumeData -->
    <section id="hero" class="hero" aria-label="Introduction"></section>
    <section id="highlights" class="highlights" aria-label="Career highlights"></section>
    <section id="hackathons" class="hackathons section" aria-label="Hackathons and competitions"></section>
    <section id="projects" class="projects section" aria-label="Projects"></section>
    <section id="experience" class="experience section" aria-label="Professional experience"></section>
    <section id="education" class="education section" aria-label="Education"></section>
    <section id="gallery" class="gallery section" aria-label="Photo gallery"></section>
    <section id="contact" class="contact section" aria-label="Contact"></section>
  </main>

  <!-- ======== FOOTER ======== -->
  <footer id="footer" class="footer" role="contentinfo"></footer>

  <!-- ======== MODAL (for hackathon detail cards) ======== -->
  <div class="modal-overlay" id="modalOverlay" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal" tabindex="-1">
      <button class="modal__close" id="modalClose" aria-label="Close modal">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
      <div class="modal__content" id="modalContent"></div>
    </div>
  </div>

  <!-- ======== LIGHTBOX MODAL (click-to-view photo gallery & thumbnails) ======== -->
  <div class="lightbox-overlay" id="lightboxOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Photo Lightbox" tabindex="-1">
    <div class="lightbox" id="lightbox">
      <button class="lightbox__close" id="lightboxClose" aria-label="Close lightbox">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <button class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="Previous photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="lightbox__stage">
        <div class="lightbox__media" id="lightboxMedia">
          <img class="lightbox__img" id="lightboxImg" src="" alt="" />
        </div>
        <div class="lightbox__info" id="lightboxInfo">
          <div class="lightbox__meta">
            <span class="lightbox__title" id="lightboxTitle"></span>
            <span class="lightbox__counter" id="lightboxCounter"></span>
          </div>
          <p class="lightbox__caption" id="lightboxCaption"></p>
        </div>
      </div>
      <button class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="Next photo">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <!-- ======== BACK-TO-TOP BUTTON ======== -->
  <button class="back-to-top" id="backToTop" aria-label="Back to top">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <!-- ======== TOAST NOTIFICATION ======== -->
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- ======== VIEWPORT INDICATOR (dev tool, toggled with Shift+D) ======== -->
  <div class="viewport-badge hidden" id="viewportBadge" aria-hidden="true"></div>

  <!-- JavaScript (loaded at end of body for performance) -->
  <script src="script.js"></script>
</body>
</html>
